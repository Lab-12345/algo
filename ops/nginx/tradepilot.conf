# TradePilot Nginx Production Configuration
# Place in /etc/nginx/sites-available/tradepilot and symlink to /etc/nginx/sites-enabled/

server {
    listen 80;
    listen [::]:80;
    server_name _; # Replace with your domain name or VPS public IP

    # Redirect all HTTP requests to HTTPS once SSL certificate is installed via Certbot
    # return 301 https://$host$request_uri;

    # Root for React Frontend Static Build
    root /var/www/tradepilot/client/dist;
    index index.html index.htm;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/json;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # SPA Routing: fallback to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API Requests to Express Backend (Port 5000)
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    # Direct Health Check
    location /health {
        proxy_pass http://127.0.0.1:5000/health;
    }
}
